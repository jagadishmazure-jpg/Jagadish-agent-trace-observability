[project]
name = "agent-trace-observability"
version = "0.1.0"
description = "Agent trace observability: span trees, PII-redacted traces, cost and latency analytics, budget caps, failure mining"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B"]
ignore = ["E741", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
